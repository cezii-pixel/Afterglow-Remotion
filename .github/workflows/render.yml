name: Render Video

on:
  push:
name: Render Video

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Render Remotion Video
        run: npx remotion render src/Root.tsx AfterglowIntro out/video.mp4 --codec=h264 --overwrite

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/video.mp4





