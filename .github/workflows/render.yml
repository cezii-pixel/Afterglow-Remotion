name: Render Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute Render Script
        run: node render.mjs

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/video.mp4
