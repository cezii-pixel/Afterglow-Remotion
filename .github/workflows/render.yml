name: Render Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx remotion render src/Root.tsx AfterglowIntro out/video.mp4 --gl=angle --concurrency=1
      - uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/video.mp4
